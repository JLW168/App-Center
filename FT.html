<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Tree Organizer</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Utility: Random ID Generator ---
    function generateId() {
      return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    }

    // --- Custom Inline SVG Icons ---
    const IconBase = ({ children, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const Users = ({className}) => <IconBase className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>;
    const SaveIcon = ({className}) => <IconBase className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>;
    const Upload = ({className}) => <IconBase className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></IconBase>;
    const Edit = ({className}) => <IconBase className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></IconBase>;
    const Trash2 = ({className}) => <IconBase className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>;
    const X = ({className}) => <IconBase className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;
    const Plus = ({className}) => <IconBase className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></IconBase>;
    const Cloud = ({className}) => <IconBase className={className}><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></IconBase>;
    const ShareIcon = ({className}) => <IconBase className={className}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></IconBase>;
    const Eye = ({className}) => <IconBase className={className}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></IconBase>;

    // --- Constants ---
    const NODE_WIDTH = 180;
    const NODE_HEIGHT = 100;

    // --- Components ---
    const FamilyNode = ({ node, isSelected, onSelect, onPointerDown }) => {
      const { data } = node;
      const isDeceased = data.dod && data.dod !== '';
      
      let bgColor = 'bg-gray-100';
      let borderColor = 'border-gray-300';
      if (data.sex === 'Male') {
        bgColor = 'bg-blue-50';
        borderColor = 'border-blue-300';
      } else if (data.sex === 'Female') {
        bgColor = 'bg-pink-50';
        borderColor = 'border-pink-300';
      }

      return (
        <div 
          className={`absolute shadow-md rounded-xl border-2 ${bgColor} ${isSelected ? 'border-blue-600 ring-2 ring-blue-200' : borderColor} cursor-grab active:cursor-grabbing select-none transition-shadow`}
          style={{ left: node.x, top: node.y, width: NODE_WIDTH, height: NODE_HEIGHT, touchAction: 'none' }}
          onPointerDown={(e) => onPointerDown(e, node.id)}
          onClick={(e) => { e.stopPropagation(); onSelect(node); }}
        >
          <div className="flex flex-col items-center justify-center h-full p-2 relative">
            <div className="font-bold text-gray-800 text-center text-sm truncate w-full">{data.name || 'Unknown'}</div>
            <div className="text-[11px] text-gray-500 mt-1 flex flex-col items-center w-full">
               {data.dob && <span className="truncate w-full text-center">b: {data.dob}</span>}
               {data.dod && <span className="truncate w-full text-center">d: {data.dod}</span>}
            </div>
            {isDeceased && <div className="absolute top-2 right-2 w-2.5 h-2.5 bg-gray-800 rounded-full border border-white" title="Deceased"></div>}
          </div>
        </div>
      );
    };

    function FamilyTreeApp() {
      const [nodes, setNodes] = useState([]);
      const [edges, setEdges] = useState([]);
      
      const [selectedNodeId, setSelectedNodeId] = useState(null);
      const [dragInfo, setDragInfo] = useState(null);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [isPanning, setIsPanning] = useState(false);
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [editingNodeId, setEditingNodeId] = useState(null);
      const [formData, setFormData] = useState({ name: '', sex: 'Unknown', dob: '', dod: '', notes: '', spouseId: '', parentId: '' });

      const canvasRef = useRef(null);

      // Security / Mode State
      const [isLoaded, setIsLoaded] = useState(false);
      const [syncStatus, setSyncStatus] = useState('Initializing...');
      const [firebaseInstances, setFirebaseInstances] = useState(null);
      const [isViewOnly, setIsViewOnly] = useState(false);

      useEffect(() => {
        const initFirebase = async () => {
          try {
            setSyncStatus('Connecting...');
            
            // Determine Mode (Admin vs View Only) based on URL param
            const urlParams = new URLSearchParams(window.location.search);
            const viewId = urlParams.get('view');
            const readonlyMode = !!viewId;
            setIsViewOnly(readonlyMode);

            // Use native dynamic import via Function to bypass Babel's CommonJS transformation
            // This prevents the "require is not defined" error in the browser
            const nativeImport = new Function('url', 'return import(url)');

            const { initializeApp } = await nativeImport('https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js');
            const { getFirestore, doc, getDoc, setDoc } = await nativeImport('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');
            const { getAuth, signInAnonymously } = await nativeImport('https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js');

            const firebaseConfig = {
              apiKey: "AIzaSyBWjcR-oJ0RF0RuId_dDuQ_fJ4pUGwOykI",
              authDomain: "familytree-8fb37.firebaseapp.com",
              projectId: "familytree-8fb37",
              storageBucket: "familytree-8fb37.firebasestorage.app",
              messagingSenderId: "792607492944",
              appId: "1:792607492944:web:e9946edd9d481b82a53a55",
              measurementId: "G-5JN27TKQDS"
            };

            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const auth = getAuth(app);

            // Sign in to authenticate with Firebase
            const userCredential = await signInAnonymously(auth);
            const uid = userCredential.user.uid;

            setFirebaseInstances({ db, uid, setDoc, doc });

            // Determine which tree to load
            const targetUid = readonlyMode ? viewId : uid;
            const docRef = doc(db, "trees", targetUid);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
              const data = docSnap.data();
              if(data.nodes) setNodes(data.nodes);
              if(data.edges) setEdges(data.edges);
            } else if (!readonlyMode) {
                // Initial setup for new Admin users
                const initN = [
                  { id: 'root-1', x: 400, y: 100, data: { name: 'Grandpa', sex: 'Male' } },
                  { id: 'root-2', x: 650, y: 100, data: { name: 'Grandma', sex: 'Female' } }
                ];
                const initE = [{ id: 'e1', source: 'root-1', target: 'root-2', type: 'spouse' }];
                setNodes(initN);
                setEdges(initE);
            }
            
            setIsLoaded(true);
            setSyncStatus(readonlyMode ? 'Viewing Live' : 'Synced to Cloud');
          } catch (error) {
            console.error("Firebase Error:", error);
            setSyncStatus('Connection Failed');
            setIsLoaded(true);
          }
        };

        initFirebase();
      }, []);

      useEffect(() => {
        // Prevent saving if in View Only mode, or not loaded
        if (!isLoaded || isViewOnly || !firebaseInstances) return;

        setSyncStatus('Saving...');
        const saveTimer = setTimeout(() => {
          const { db, uid, setDoc, doc } = firebaseInstances;
          setDoc(doc(db, "trees", uid), { nodes, edges })
            .then(() => setSyncStatus('Synced to Cloud'))
            .catch(() => setSyncStatus('Sync Error'));
        }, 1500); 

        return () => clearTimeout(saveTimer);
      }, [nodes, edges, isLoaded, isViewOnly, firebaseInstances]);


      // --- Event Handlers ---
      const handlePointerDownCanvas = (e) => {
        if (e.target.closest('.node-element') || e.target.closest('.action-panel')) return;
        setIsPanning(true);
        setSelectedNodeId(null);
        setDragInfo({ type: 'pan', startX: e.clientX, startY: e.clientY, startPanX: pan.x, startPanY: pan.y });
      };

      const handlePointerDownNode = (e, id) => {
        e.stopPropagation();
        setSelectedNodeId(id);
        
        // Prevent dragging if in view only mode
        if (isViewOnly) return; 

        const node = nodes.find(n => n.id === id);
        setDragInfo({ type: 'node', id, startX: e.clientX, startY: e.clientY, nodeStartX: node.x, nodeStartY: node.y });
      };

      const handlePointerMove = (e) => {
        if (!dragInfo) return;
        if (dragInfo.type === 'node' && !isViewOnly) {
          const dx = e.clientX - dragInfo.startX;
          const dy = e.clientY - dragInfo.startY;
          setNodes(nds => nds.map(n => n.id === dragInfo.id ? { ...n, x: dragInfo.nodeStartX + dx, y: dragInfo.nodeStartY + dy } : n));
        } else if (dragInfo.type === 'pan') {
          const dx = e.clientX - dragInfo.startX;
          const dy = e.clientY - dragInfo.startY;
          setPan({ x: dragInfo.startPanX + dx, y: dragInfo.startPanY + dy });
        }
      };

      const handlePointerUp = () => { setDragInfo(null); setIsPanning(false); };

      const renderEdges = () => {
        return edges.map(edge => {
          const source = nodes.find(n => n.id === edge.source);
          const target = nodes.find(n => n.id === edge.target);
          if (!source || !target) return null;

          const sX = source.x + NODE_WIDTH / 2;
          const sY = source.y + NODE_HEIGHT / 2;
          const tX = target.x + NODE_WIDTH / 2;
          const tY = target.y + NODE_HEIGHT / 2;
          
          if (edge.type === 'spouse') {
            return <path key={edge.id} d={`M ${sX} ${sY} L ${tX} ${tY}`} stroke="#ff0072" strokeWidth="3" strokeDasharray="6,6" fill="none" />;
          } else {
            const childEdges = edges.filter(e => e.target === edge.target && e.type === 'child');
            let startX = sX, startY = sY;

            // Merge lines if there are two parents
            if (childEdges.length === 2) {
              if (edge.id !== childEdges[0].id) return null; 
              const p1 = nodes.find(n => n.id === childEdges[0].source);
              const p2 = nodes.find(n => n.id === childEdges[1].source);
              if (p1 && p2) {
                startX = (p1.x + p2.x) / 2 + NODE_WIDTH / 2;
                startY = (p1.y + p2.y) / 2 + NODE_HEIGHT / 2;
              }
            }

            const midY = (startY + tY) / 2;
            return (
              <g key={edge.id}>
                <path d={`M ${startX} ${startY} V ${midY} H ${tX} V ${tY}`} stroke="#94a3b8" strokeWidth="2" fill="none" />
                <polygon points={`${tX-5},${tY-NODE_HEIGHT/2 - 10} ${tX+5},${tY-NODE_HEIGHT/2 - 10} ${tX},${tY-NODE_HEIGHT/2}`} fill="#94a3b8" />
              </g>
            );
          }
        });
      };

      const getSafePosition = (startX, startY, currentNodes, excludeNodeId = null) => {
        let safeX = startX;
        let safeY = startY;
        let overlap = true;
        let attempts = 0;
        
        while (overlap && attempts < 50) {
          overlap = false;
          for (let n of currentNodes) {
            if (n.id === excludeNodeId) continue;
            // Check bounding box overlap
            if (Math.abs(n.x - safeX) < NODE_WIDTH + 20 && Math.abs(n.y - safeY) < NODE_HEIGHT + 20) {
              safeX += NODE_WIDTH + 40; 
              overlap = true;
              break;
            }
          }
          attempts++;
        }
        return { x: safeX, y: safeY };
      };

      const handleOpenModal = (node = null) => {
        if (isViewOnly) return;
        if (node) {
          setEditingNodeId(node.id);
          const spouseEdge = edges.find(e => e.type === 'spouse' && (e.source === node.id || e.target === node.id));
          const parentEdge = edges.find(e => e.type === 'child' && e.target === node.id);
          setFormData({ 
            ...node.data, 
            spouseId: spouseEdge ? (spouseEdge.source === node.id ? spouseEdge.target : spouseEdge.source) : '', 
            parentId: parentEdge ? parentEdge.source : '' 
          });
        } else {
          setEditingNodeId(null);
          setFormData({ name: '', sex: 'Unknown', dob: '', dod: '', notes: '', spouseId: '', parentId: '' });
        }
        setIsModalOpen(true);
      };

      const handleSaveMember = (e) => {
        e.preventDefault();
        let nodeId = editingNodeId || generateId();
        
        const nodeDataToSave = { ...formData };
        const newSpouseId = nodeDataToSave.spouseId;
        const newParentId = nodeDataToSave.parentId;
        delete nodeDataToSave.spouseId;
        delete nodeDataToSave.parentId;

        if (editingNodeId) {
          setNodes(nds => nds.map(n => n.id === editingNodeId ? { ...n, data: nodeDataToSave } : n));
        } else {
          const selected = nodes.find(n => n.id === selectedNodeId);
          let startX = selected ? selected.x + NODE_WIDTH + 40 : -pan.x + window.innerWidth / 2 - NODE_WIDTH/2; 
          let startY = selected ? selected.y : -pan.y + window.innerHeight / 2 - NODE_HEIGHT/2;
          
          const pos = getSafePosition(startX, startY, nodes);
          setNodes(nds => [...nds, { id: nodeId, x: pos.x, y: pos.y, data: nodeDataToSave }]);
        }
        
        // Relationship Syncing
        setEdges(eds => {
          let newEdges = [...eds];
          
          // Sync Spouse
          const spouseEdgeIdx = newEdges.findIndex(edge => edge.type === 'spouse' && (edge.source === nodeId || edge.target === nodeId));
          const oldSpouseId = spouseEdgeIdx !== -1 ? (newEdges[spouseEdgeIdx].source === nodeId ? newEdges[spouseEdgeIdx].target : newEdges[spouseEdgeIdx].source) : '';
          
          if (oldSpouseId !== newSpouseId) {
              if (spouseEdgeIdx !== -1) newEdges.splice(spouseEdgeIdx, 1);
              if (newSpouseId) newEdges.push({ id: generateId(), source: nodeId, target: newSpouseId, type: 'spouse' });
          }
          
          // Sync Parent (Biologically link to both parents if married)
          const parentEdges = newEdges.filter(edge => edge.type === 'child' && edge.target === nodeId);
          const oldParentId = parentEdges.length > 0 ? parentEdges[0].source : '';
          
          if (oldParentId !== newParentId) {
              newEdges = newEdges.filter(edge => !(edge.type === 'child' && edge.target === nodeId));
              if (newParentId) {
                  newEdges.push({ id: generateId(), source: newParentId, target: nodeId, type: 'child' });
                  // Find if parent has a spouse, auto link
                  const parentSpouse = newEdges.find(e => e.type === 'spouse' && (e.source === newParentId || e.target === newParentId));
                  if (parentSpouse) {
                      const pSpouseId = parentSpouse.source === newParentId ? parentSpouse.target : parentSpouse.source;
                      newEdges.push({ id: generateId(), source: pSpouseId, target: nodeId, type: 'child' });
                  }
              }
          }
          return newEdges;
        });

        setIsModalOpen(false);
      };

      const handleDeleteMember = (nodeId) => {
        if (isViewOnly) return;
        setNodes(nds => nds.filter(n => n.id !== nodeId));
        setEdges(eds => eds.filter(e => e.source !== nodeId && e.target !== nodeId));
        setSelectedNodeId(null);
      };

      const handleAddRelative = (relationType) => {
        if (isViewOnly || !selectedNodeId) return;
        const selected = nodes.find(n => n.id === selectedNodeId);
        if (!selected) return;

        const newNodeId = generateId();
        let targetX = selected.x;
        let targetY = selected.y;
        let newEdgesToAdd = [];
        let formSpouseId = '';
        let formParentId = '';
        
        if (relationType === 'parent') {
           const existingParents = edges.filter(e => e.type === 'child' && e.target === selected.id);
           if (existingParents.length === 1) {
               // Add second parent and automatically marry them to the first parent
               const firstParentId = existingParents[0].source;
               const firstParent = nodes.find(n => n.id === firstParentId);
               if (firstParent) {
                   targetX = firstParent.x + NODE_WIDTH + 60; 
                   targetY = firstParent.y;
                   newEdgesToAdd.push({ id: generateId(), source: newNodeId, target: selected.id, type: 'child' });
                   newEdgesToAdd.push({ id: generateId(), source: firstParentId, target: newNodeId, type: 'spouse' });
                   formSpouseId = firstParentId;
               }
           } else {
               targetY = selected.y - 200;
               newEdgesToAdd.push({ id: generateId(), source: newNodeId, target: selected.id, type: 'child' });
           }
        } else if (relationType === 'spouse') {
           targetX = selected.x + NODE_WIDTH + 60;
           newEdgesToAdd.push({ id: generateId(), source: selected.id, target: newNodeId, type: 'spouse' });
           formSpouseId = selected.id;
        } else if (relationType === 'child') {
           targetY = selected.y + 200;
           newEdgesToAdd.push({ id: generateId(), source: selected.id, target: newNodeId, type: 'child' });
           formParentId = selected.id;
           
           const spouseEdge = edges.find(e => e.type === 'spouse' && (e.source === selected.id || e.target === selected.id));
           if (spouseEdge) {
               const spouseId = spouseEdge.source === selected.id ? spouseEdge.target : spouseEdge.source;
               newEdgesToAdd.push({ id: generateId(), source: spouseId, target: newNodeId, type: 'child' });
               const spouseNode = nodes.find(n => n.id === spouseId);
               if (spouseNode) targetX = (selected.x + spouseNode.x) / 2;
           }
        }

        const pos = getSafePosition(targetX, targetY, nodes);

        setNodes(nds => [...nds, { id: newNodeId, x: pos.x, y: pos.y, data: { name: `New ${relationType}`, sex: 'Unknown' } }]);
        setEdges(eds => [...eds, ...newEdgesToAdd]);
        setEditingNodeId(newNodeId);
        setFormData({ name: '', sex: 'Unknown', dob: '', dod: '', notes: '', spouseId: formSpouseId, parentId: formParentId });
        setIsModalOpen(true);
        setSelectedNodeId(newNodeId);
      };

      const handleCopyShareLink = () => {
        const input = document.getElementById('share-link-input');
        input.select();
        document.execCommand('copy');
        setSyncStatus('Link Copied!');
        setTimeout(() => setSyncStatus('Synced to Cloud'), 2000);
      };

      const selectedNode = nodes.find(n => n.id === selectedNodeId);

      return (
        <div className="w-full h-screen flex flex-col bg-gray-50 font-sans overflow-hidden fade-in">
          <header className="bg-white shadow-sm px-6 py-4 flex items-center justify-between z-50 relative">
            <div className="flex items-center space-x-2">
              <Users className="text-blue-600 w-6 h-6" />
              <h1 className="text-xl font-bold text-gray-800 truncate">
                Family Tree Organizer {isViewOnly && <span className="ml-2 text-sm font-normal text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full border border-indigo-200">View Only</span>}
              </h1>
              
              <div className={`ml-4 flex items-center text-xs px-2 py-1 rounded-full ${
                syncStatus === 'Synced to Cloud' || syncStatus === 'Viewing Live' ? 'bg-green-100 text-green-700' : 
                syncStatus === 'Saving...' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-600'
              }`}>
                {isViewOnly ? <Eye className="w-3 h-3 mr-1" /> : <Cloud className="w-3 h-3 mr-1" />}
                {syncStatus}
              </div>
            </div>

            <div className="flex space-x-2 md:space-x-3">
              {!isViewOnly ? (
                <>
                  <button onClick={() => handleOpenModal()} className="flex items-center space-x-1 px-3 md:px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors text-sm font-medium">
                    <Plus className="w-4 h-4" />
                    <span className="hidden sm:inline">Add Member</span>
                  </button>
                  <div className="h-6 border-l border-gray-300 mx-1 md:mx-2 self-center"></div>
                  <button onClick={() => setIsShareModalOpen(true)} className="flex items-center space-x-1 px-3 md:px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors text-sm font-medium">
                    <ShareIcon className="w-4 h-4" />
                    <span className="hidden sm:inline">Share</span>
                  </button>
                </>
              ) : (
                 <a href="?" className="text-sm text-blue-600 hover:underline">Create Your Own Tree</a>
              )}
            </div>
          </header>

          <div 
            ref={canvasRef}
            className={`flex-1 relative overflow-hidden bg-slate-50 ${isPanning ? 'cursor-grabbing' : 'cursor-grab'}`}
            onPointerDown={handlePointerDownCanvas}
            onPointerMove={handlePointerMove}
            onPointerUp={handlePointerUp}
            onPointerLeave={handlePointerUp}
          >
            <div 
              className="absolute inset-0 pointer-events-none opacity-20"
              style={{ backgroundImage: `radial-gradient(circle, #94a3b8 1px, transparent 1px)`, backgroundSize: '20px 20px', backgroundPosition: `${pan.x}px ${pan.y}px` }}
            ></div>

            <div className="absolute origin-top-left" style={{ transform: `translate(${pan.x}px, ${pan.y}px)` }}>
              <svg className="absolute overflow-visible pointer-events-none" style={{ left: 0, top: 0, width: '1px', height: '1px' }}>
                {renderEdges()}
              </svg>

              {nodes.map(node => (
                <div key={node.id} className="node-element absolute">
                  <FamilyNode node={node} isSelected={selectedNodeId === node.id} onSelect={(n) => setSelectedNodeId(n.id)} onPointerDown={handlePointerDownNode} />
                </div>
              ))}
            </div>

            {/* Smart Action Panel */}
            {selectedNode && (
              <div className="action-panel absolute bottom-6 left-1/2 transform -translate-x-1/2 bg-white rounded-xl shadow-xl border border-gray-200 p-4 flex flex-col items-center z-40 max-w-lg w-full">
                <div className="text-sm font-semibold text-gray-700 mb-3 border-b pb-2 w-full flex items-center justify-between">
                   <div className="flex-1 text-center truncate pr-4 text-lg">
                      {selectedNode.data.name || 'Unknown'} 
                      <span className="text-xs text-gray-500 font-normal ml-2">({selectedNode.data.sex})</span>
                   </div>
                   <button onClick={() => setSelectedNodeId(null)} className="text-gray-400 hover:text-gray-600 flex-shrink-0"><X className="w-5 h-5"/></button>
                </div>
                
                {/* View-Only Details Display */}
                {(isViewOnly || selectedNode.data.notes || selectedNode.data.dob) && (
                  <div className="w-full text-sm text-gray-600 mb-3 px-2">
                    {selectedNode.data.dob && <p><strong>Born:</strong> {selectedNode.data.dob} {selectedNode.data.dod && <span> - <strong>Died:</strong> {selectedNode.data.dod}</span>}</p>}
                    {selectedNode.data.notes && <p className="mt-1"><strong>Notes:</strong> {selectedNode.data.notes}</p>}
                  </div>
                )}

                {/* Edit Controls - Hidden in View Only mode */}
                {!isViewOnly && (
                  <div className="flex flex-wrap justify-center gap-2 mt-2 w-full">
                    <button onClick={() => handleOpenModal(selectedNode)} className="px-3 py-1.5 text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-md transition-colors flex items-center text-sm font-medium">
                      <Edit className="w-4 h-4 mr-1" /> Edit
                    </button>
                    <div className="w-px h-8 bg-gray-200 self-center hidden sm:block"></div>
                    <button onClick={() => handleAddRelative('parent')} className="px-3 py-1.5 text-sm font-medium bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-md">Add Parent</button>
                    <button onClick={() => handleAddRelative('spouse')} className="px-3 py-1.5 text-sm font-medium bg-pink-50 hover:bg-pink-100 text-pink-700 rounded-md">Add Spouse</button>
                    <button onClick={() => handleAddRelative('child')} className="px-3 py-1.5 text-sm font-medium bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-md">Add Child</button>
                    <div className="w-px h-8 bg-gray-200 self-center hidden sm:block"></div>
                    <button onClick={() => handleDeleteMember(selectedNode.id)} className="px-3 py-1.5 text-red-600 bg-red-50 hover:bg-red-100 rounded-md transition-colors flex items-center text-sm font-medium">
                      <Trash2 className="w-4 h-4 mr-1" /> Delete
                    </button>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Share Modal */}
          {isShareModalOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                <div className="flex justify-between items-center px-6 py-4 border-b border-gray-100 bg-gray-50">
                  <h2 className="text-lg font-semibold text-gray-800 flex items-center"><ShareIcon className="w-5 h-5 mr-2 text-green-600" /> Share Family Tree</h2>
                  <button onClick={() => setIsShareModalOpen(false)} className="text-gray-400 hover:text-gray-600 bg-gray-200/50 hover:bg-gray-200 rounded-full p-1"><X className="w-5 h-5" /></button>
                </div>
                <div className="p-6">
                  <p className="text-sm text-gray-600 mb-4">Send this link to family members. They will be able to view the tree and read details, but they <strong>cannot</strong> drag, edit, or delete members.</p>
                  
                  {}
                  {window.location.href.startsWith('blob:') && (
                     <div className="mb-4 p-3 bg-blue-50 text-blue-700 text-xs rounded-lg border border-blue-100 leading-relaxed">
                        <strong>Note:</strong> You are currently in a temporary preview environment. To share a real link, you must host this file on the internet (e.g., via Firebase Hosting) and append the view ID below to your final URL.
                     </div>
                  )}

                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      readOnly 
                      value={window.location.href.startsWith('blob:') ? `https://your-website.com/?view=${firebaseInstances?.uid}` : `${window.location.href.split('?')[0]}?view=${firebaseInstances?.uid}`} 
                      className="flex-1 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 outline-none" 
                      id="share-link-input" 
                    />
                    <button onClick={handleCopyShareLink} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium text-sm transition-colors">
                      Copy
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Add/Edit Modal */}
          {isModalOpen && !isViewOnly && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                <div className="flex justify-between items-center px-6 py-4 border-b border-gray-100 bg-gray-50">
                  <h2 className="text-lg font-semibold text-gray-800">{editingNodeId ? 'Edit Family Member' : 'Add Family Member'}</h2>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600 bg-gray-200/50 hover:bg-gray-200 rounded-full p-1"><X className="w-5 h-5" /></button>
                </div>
                
                <form onSubmit={handleSaveMember} className="p-6 space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Name</label>
                    <input type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white" required placeholder="Full Name" />
                  </div>
                  
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Sex</label>
                      <select value={formData.sex} onChange={e => setFormData({...formData, sex: e.target.value})} className="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white">
                        <option value="Unknown">Unknown</option><option value="Male">Male</option><option value="Female">Female</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
                      <input type="date" value={formData.dob} onChange={e => setFormData({...formData, dob: e.target.value})} className="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-sm" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Date of Death (if applicable)</label>
                    <input type="date" value={formData.dod} onChange={e => setFormData({...formData, dod: e.target.value})} className="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-sm" />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Married with (Spouse)</label>
                      <select value={formData.spouseId || ''} onChange={e => setFormData({...formData, spouseId: e.target.value})} className="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-sm">
                        <option value="">None</option>
                        {nodes.filter(n => n.id !== editingNodeId).map(n => <option key={n.id} value={n.id}>{n.data.name || 'Unnamed'}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Child of (Parent)</label>
                      <select value={formData.parentId || ''} onChange={e => setFormData({...formData, parentId: e.target.value})} className="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-sm">
                        <option value="">None</option>
                        {nodes.filter(n => n.id !== editingNodeId).map(n => <option key={n.id} value={n.id}>{n.data.name || 'Unnamed'}</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Notes / Description</label>
                    <textarea value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} rows={3} className="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white resize-none" placeholder="Additional details..." />
                  </div>

                  <div className="mt-8 flex justify-end space-x-3 pt-4">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-5 py-2.5 rounded-lg text-gray-700 bg-gray-100 hover:bg-gray-200 font-medium">Cancel</button>
                    <button type="submit" className="px-5 py-2.5 rounded-lg shadow-sm text-white bg-blue-600 hover:bg-blue-700 font-medium">Save Member</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FamilyTreeApp />);
  </script>
</body>
</html>
