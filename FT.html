<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Tree Organizer</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    /* Custom Scrollbar for Table & Modals */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function generateId() {
      return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    }

    const IconBase = ({ children, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const Users = ({className}) => <IconBase className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>;
    const Edit = ({className}) => <IconBase className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></IconBase>;
    const Trash2 = ({className}) => <IconBase className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>;
    const X = ({className}) => <IconBase className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;
    const Plus = ({className}) => <IconBase className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></IconBase>;
    const Cloud = ({className}) => <IconBase className={className}><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></IconBase>;
    const ShareIcon = ({className}) => <IconBase className={className}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></IconBase>;
    const Eye = ({className}) => <IconBase className={className}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></IconBase>;
    const LogOut = ({className}) => <IconBase className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></IconBase>;
    const ListIcon = ({className}) => <IconBase className={className}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></IconBase>;
    const DiagramIcon = ({className}) => <IconBase className={className}><rect x="8" y="2" width="8" height="6" rx="1"/><path d="M12 8v4"/><path d="M8 12H4v2"/><path d="M16 12h4v2"/><rect x="2" y="14" width="8" height="6" rx="1"/><rect x="14" y="14" width="8" height="6" rx="1"/></IconBase>;

    const NODE_WIDTH = 160;
    const NODE_HEIGHT = 75;
    const ADMIN_UID = 'TOqcYR4pHjd4H2oI2LslDyENsKw1';

    const FamilyNode = ({ node, isSelected, onSelect, onPointerDown }) => {
      const { data } = node;
      const isDeceased = data.dod && data.dod !== '';
      
      let bgColor = 'bg-gray-100';
      let borderColor = 'border-gray-300';
      if (data.sex === 'M') {
        bgColor = 'bg-blue-50';
        borderColor = 'border-blue-300';
      } else if (data.sex === 'F') {
        bgColor = 'bg-pink-50';
        borderColor = 'border-pink-300';
      }

      return (
        <div 
          className={`absolute shadow-md rounded-xl border-2 ${bgColor} ${isSelected ? 'border-blue-600 ring-4 ring-blue-200 z-30' : `${borderColor} z-10`} cursor-grab active:cursor-grabbing select-none transition-all duration-200`}
          style={{ left: node.x, top: node.y, width: NODE_WIDTH, height: NODE_HEIGHT, touchAction: 'none' }}
          onPointerDown={(e) => onPointerDown(e, node.id)}
          onClick={(e) => { e.stopPropagation(); onSelect(node); }}
        >
          <div className="flex flex-col items-center justify-center h-full p-2 relative">
            <div className="font-bold text-gray-800 text-center text-sm truncate w-full">{data.name || 'Unknown'}</div>
            {data.nickname && <div className="text-[10px] font-semibold text-gray-600 truncate w-full text-center">"{data.nickname}"</div>}
            
            <div className="text-[10px] text-gray-500 mt-0.5 flex flex-col items-center w-full leading-tight">
               {data.dob && <span className="truncate w-full text-center">b: {data.dob}</span>}
               {data.dod && <span className="truncate w-full text-center">d: {data.dod}</span>}
            </div>
            
            {isDeceased && <div className="absolute top-2 right-2 w-2.5 h-2.5 bg-gray-800 rounded-full border border-white shadow-sm" title="Deceased"></div>}
          </div>
        </div>
      );
    };

    function FamilyTreeApp() {
      // Core Data
      const [nodes, setNodes] = useState([]);
      const [edges, setEdges] = useState([]);
      
      // UI & View State
      const [viewMode, setViewMode] = useState('graph'); // 'graph' or 'table'
      const [selectedNodeId, setSelectedNodeId] = useState(null);
      const [dragInfo, setDragInfo] = useState(null);
      const [pan, setPan] = useState({ x: window.innerWidth > 768 ? 50 : -100, y: 50 });
      const [isPanning, setIsPanning] = useState(false);
      
      // Modals & Forms
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
      const [editingNodeId, setEditingNodeId] = useState(null);
      const [pendingRelation, setPendingRelation] = useState(null);
      const [formData, setFormData] = useState({ name: '', nickname: '', sex: 'Unknown', dob: '', dod: '', address: '', notes: '', spouseId: '', parentId: '' });
      const [loginData, setLoginData] = useState({ email: 'jlw@jlw.com', password: '' });

      // Firebase & Auth State
      const [isLoaded, setIsLoaded] = useState(false);
      const [syncStatus, setSyncStatus] = useState('Initializing...');
      const [firebaseInstances, setFirebaseInstances] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [firebaseError, setFirebaseError] = useState(null);
      const canvasRef = useRef(null);

      const getGreeting = () => {
        const hour = new Date().getHours();
        if (hour < 12) return 'Good Morning';
        if (hour < 18) return 'Good Afternoon';
        return 'Good Evening';
      };

      useEffect(() => {
        const initFirebase = async () => {
          try {
            setSyncStatus('Connecting...');
            const nativeImport = new Function('url', 'return import(url)');
            
            const { initializeApp } = await nativeImport('https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js');
            const { getFirestore, doc, getDoc, setDoc } = await nativeImport('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');
            const { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } = await nativeImport('https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js');

            const firebaseConfig = {
              apiKey: "AIzaSyBWjcR-oJ0RF0RuId_dDuQ_fJ4pUGwOykI",
              authDomain: "familytree-8fb37.firebaseapp.com",
              projectId: "familytree-8fb37",
              storageBucket: "familytree-8fb37.firebasestorage.app",
              messagingSenderId: "792607492944",
              appId: "1:792607492944:web:e9946edd9d481b82a53a55",
              measurementId: "G-5JN27TKQDS"
            };

            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const auth = getAuth(app);

            setFirebaseInstances({ db, auth, signInWithEmailAndPassword, signOut, setDoc, doc });

            // 1. Fetch data immediately for EVERYONE (Public View)
            const docRef = doc(db, 'artifacts', 'familytree-8fb37', 'public', 'data', 'members', 'treeData');
            try {
              const docSnap = await getDoc(docRef);
              if (docSnap.exists()) {
                const data = docSnap.data();
                if(data.nodes) setNodes(data.nodes);
                if(data.edges) setEdges(data.edges);
                setSyncStatus('Public View Mode');
              } else {
                setSyncStatus('No Tree Data Yet');
              }
            } catch (err) {
               console.error("Firestore Fetch Error:", err);
               setFirebaseError("Cannot read from database. " + err.message);
            } finally {
               setIsLoaded(true); // Always clear the loading state
            }

            // 2. Listen for Auth Changes in the background (Admin check)
            onAuthStateChanged(auth, (user) => {
              const isAdminUser = user && user.uid === ADMIN_UID;
              setIsAdmin(isAdminUser);
              
              if (isAdminUser) {
                setSyncStatus('Synced to Cloud');
                // If admin logs in and the tree is completely empty, initialize the root member
                setNodes(currentNodes => {
                  if (currentNodes.length === 0) {
                     return [{ id: 'root-1', x: Math.max(100, window.innerWidth/2 - NODE_WIDTH/2), y: 100, data: { name: 'Root Member', sex: 'M' } }];
                  }
                  return currentNodes;
                });
              } else {
                setSyncStatus('Public View Mode');
              }
            });

          } catch (error) {
            console.error("Firebase Init Error:", error);
            setFirebaseError(error.message);
            setSyncStatus('Connection Failed');
            setIsLoaded(true);
          }
        };
        initFirebase();
      }, []);

      useEffect(() => {
        if (!isLoaded || !isAdmin || !firebaseInstances) return;

        setSyncStatus('Saving...');
        const saveTimer = setTimeout(() => {
          const { db, setDoc, doc } = firebaseInstances;
          const docRef = doc(db, 'artifacts', 'familytree-8fb37', 'public', 'data', 'members', 'treeData');
          
          setDoc(docRef, { nodes, edges })
            .then(() => {
                setSyncStatus('Synced to Cloud');
                setFirebaseError(null);
            })
            .catch((error) => {
                setSyncStatus('Sync Error');
                setFirebaseError("Failed to save: " + error.message);
            });
        }, 1500); 

        return () => clearTimeout(saveTimer);
      }, [nodes, edges, isLoaded, isAdmin, firebaseInstances]);

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        try {
          const { auth, signInWithEmailAndPassword } = firebaseInstances;
          await signInWithEmailAndPassword(auth, loginData.email, loginData.password);
          setIsLoginModalOpen(false);
          setLoginData({ ...loginData, password: '' });
          setFirebaseError(null);
        } catch (error) {
          setFirebaseError("Login failed: " + error.message);
        }
      };

      const handleLogout = async () => {
        try {
          const { auth, signOut } = firebaseInstances;
          await signOut(auth);
          setIsAdmin(false);
        } catch(e) {
          console.error(e);
        }
      };

      const handlePointerDownCanvas = (e) => {
        if (e.target.closest('.node-element') || e.target.closest('.smart-toolbar')) return;
        setIsPanning(true);
        setSelectedNodeId(null);
        setDragInfo({ type: 'pan', startX: e.clientX, startY: e.clientY, startPanX: pan.x, startPanY: pan.y });
      };

      const handlePointerDownNode = (e, id) => {
        e.stopPropagation();
        setSelectedNodeId(id);
        if (!isAdmin) return; 
        const node = nodes.find(n => n.id === id);
        setDragInfo({ type: 'node', id, startX: e.clientX, startY: e.clientY, nodeStartX: node.x, nodeStartY: node.y });
      };

      const handlePointerMove = (e) => {
        if (!dragInfo) return;
        if (dragInfo.type === 'node' && isAdmin) {
          const dx = e.clientX - dragInfo.startX;
          const dy = e.clientY - dragInfo.startY;
          setNodes(nds => nds.map(n => n.id === dragInfo.id ? { ...n, x: dragInfo.nodeStartX + dx, y: dragInfo.nodeStartY + dy } : n));
        } else if (dragInfo.type === 'pan') {
          const dx = e.clientX - dragInfo.startX;
          const dy = e.clientY - dragInfo.startY;
          setPan({ x: dragInfo.startPanX + dx, y: dragInfo.startPanY + dy });
        }
      };

      const handlePointerUp = () => { setDragInfo(null); setIsPanning(false); };

      const renderEdges = () => {
        return edges.map(edge => {
          const source = nodes.find(n => n.id === edge.source);
          const target = nodes.find(n => n.id === edge.target);
          if (!source || !target) return null;

          const sX = source.x + NODE_WIDTH / 2;
          const sY = source.y + NODE_HEIGHT / 2;
          const tX = target.x + NODE_WIDTH / 2;
          const tY = target.y + NODE_HEIGHT / 2;
          
          if (edge.type === 'spouse') {
            return <path key={edge.id} d={`M ${sX} ${sY} L ${tX} ${tY}`} stroke="#ec4899" strokeWidth="3" strokeDasharray="6,6" fill="none" />;
          } else {
            const childEdges = edges.filter(e => e.target === edge.target && e.type === 'child');
            let startX = sX, startY = sY;

            if (childEdges.length === 2) {
              if (edge.id !== childEdges[0].id) return null; 
              const p1 = nodes.find(n => n.id === childEdges[0].source);
              const p2 = nodes.find(n => n.id === childEdges[1].source);
              if (p1 && p2) {
                startX = (p1.x + p2.x) / 2 + NODE_WIDTH / 2;
                startY = (p1.y + p2.y) / 2 + NODE_HEIGHT / 2;
              }
            }

            const midY = (startY + tY) / 2;
            return (
              <g key={edge.id}>
                <path d={`M ${startX} ${startY} V ${midY} H ${tX} V ${tY}`} stroke="#94a3b8" strokeWidth="2" fill="none" />
                <polygon points={`${tX-5},${tY-NODE_HEIGHT/2 - 10} ${tX+5},${tY-NODE_HEIGHT/2 - 10} ${tX},${tY-NODE_HEIGHT/2}`} fill="#94a3b8" />
              </g>
            );
          }
        });
      };

      const getSafePosition = (startX, startY, currentNodes, excludeNodeId = null) => {
        let safeX = startX;
        let safeY = startY;
        let overlap = true;
        let attempts = 0;
        
        while (overlap && attempts < 50) {
          overlap = false;
          for (let n of currentNodes) {
            if (n.id === excludeNodeId) continue;
            if (Math.abs(n.x - safeX) < NODE_WIDTH + 20 && Math.abs(n.y - safeY) < NODE_HEIGHT + 20) {
              safeX += NODE_WIDTH + 40; 
              overlap = true;
              break;
            }
          }
          attempts++;
        }
        return { x: safeX, y: safeY };
      };

      const handleOpenModal = (node = null) => {
        if (!isAdmin) return;
        if (node) {
          setEditingNodeId(node.id);
          const spouseEdge = edges.find(e => e.type === 'spouse' && (e.source === node.id || e.target === node.id));
          const parentEdge = edges.find(e => e.type === 'child' && e.target === node.id);
          setFormData({ 
            ...node.data, 
            spouseId: spouseEdge ? (spouseEdge.source === node.id ? spouseEdge.target : spouseEdge.source) : '', 
            parentId: parentEdge ? parentEdge.source : '' 
          });
        } else {
          setEditingNodeId(null);
          setPendingRelation(null);
          setFormData({ name: '', nickname: '', sex: 'Unknown', dob: '', dod: '', address: '', notes: '', spouseId: '', parentId: '' });
        }
        setIsModalOpen(true);
      };

      const handleSaveMember = (e) => {
        e.preventDefault();
        let nodeId = editingNodeId || generateId();
        
        const nodeDataToSave = { ...formData };
        const newSpouseId = nodeDataToSave.spouseId;
        const newParentId = nodeDataToSave.parentId;
        delete nodeDataToSave.spouseId;
        delete nodeDataToSave.parentId;

        let extraEdges = [];

        if (editingNodeId) {
          setNodes(nds => nds.map(n => n.id === editingNodeId ? { ...n, data: nodeDataToSave } : n));
        } else {
          let startX, startY;
          if (pendingRelation) {
              const source = nodes.find(n => n.id === pendingRelation.sourceId);
              startX = source.x; startY = source.y;

              if (pendingRelation.type === 'parent') {
                  const existingParents = edges.filter(e => e.type === 'child' && e.target === source.id);
                  if (existingParents.length === 1) {
                      const firstParent = nodes.find(n => n.id === existingParents[0].source);
                      if (firstParent) { startX = firstParent.x + NODE_WIDTH + 60; startY = firstParent.y; }
                  } else { startY -= 200; }
                  extraEdges.push({ id: generateId(), source: nodeId, target: source.id, type: 'child' });
              } else if (pendingRelation.type === 'spouse') {
                  startX += NODE_WIDTH + 60;
              } else if (pendingRelation.type === 'child') {
                  startY += 200;
                  const spouseEdge = edges.find(e => e.type === 'spouse' && (e.source === source.id || e.target === source.id));
                  if (spouseEdge) {
                      const spouseId = spouseEdge.source === source.id ? spouseEdge.target : spouseEdge.source;
                      const spouseNode = nodes.find(n => n.id === spouseId);
                      if (spouseNode) startX = (source.x + spouseNode.x) / 2;
                  }
              }
          } else {
              const selected = nodes.find(n => n.id === selectedNodeId);
              startX = selected ? selected.x + NODE_WIDTH + 40 : -pan.x + window.innerWidth / 2 - NODE_WIDTH/2; 
              startY = selected ? selected.y : -pan.y + window.innerHeight / 2 - NODE_HEIGHT/2;
          }
          
          const pos = getSafePosition(startX, startY, nodes);
          setNodes(nds => [...nds, { id: nodeId, x: pos.x, y: pos.y, data: nodeDataToSave }]);
        }
        
        // Relationship Syncing
        setEdges(eds => {
          let newEdges = [...eds];
          if (extraEdges.length > 0) newEdges.push(...extraEdges);
          
          // Sync Spouse
          const spouseEdgeIdx = newEdges.findIndex(edge => edge.type === 'spouse' && (edge.source === nodeId || edge.target === nodeId));
          const oldSpouseId = spouseEdgeIdx !== -1 ? (newEdges[spouseEdgeIdx].source === nodeId ? newEdges[spouseEdgeIdx].target : newEdges[spouseEdgeIdx].source) : '';
          if (oldSpouseId !== newSpouseId) {
              if (spouseEdgeIdx !== -1) newEdges.splice(spouseEdgeIdx, 1);
              if (newSpouseId) newEdges.push({ id: generateId(), source: nodeId, target: newSpouseId, type: 'spouse' });
          }
          
          // Sync Parent
          const parentEdges = newEdges.filter(edge => edge.type === 'child' && edge.target === nodeId);
          const oldParentId = parentEdges.length > 0 ? parentEdges[0].source : '';
          if (oldParentId !== newParentId) {
              newEdges = newEdges.filter(edge => !(edge.type === 'child' && edge.target === nodeId));
              if (newParentId) {
                  newEdges.push({ id: generateId(), source: newParentId, target: nodeId, type: 'child' });
                  const parentSpouse = newEdges.find(e => e.type === 'spouse' && (e.source === newParentId || e.target === newParentId));
                  if (parentSpouse) {
                      const pSpouseId = parentSpouse.source === newParentId ? parentSpouse.target : parentSpouse.source;
                      newEdges.push({ id: generateId(), source: pSpouseId, target: nodeId, type: 'child' });
                  }
              }
          }
          return newEdges;
        });

        setPendingRelation(null);
        setIsModalOpen(false);
      };

      const handleDeleteMember = (nodeId) => {
        if (!isAdmin) return;
        setNodes(nds => nds.filter(n => n.id !== nodeId));
        setEdges(eds => eds.filter(e => e.source !== nodeId && e.target !== nodeId));
        setSelectedNodeId(null);
      };

      const handleAddRelativeInit = (relationType) => {
        if (!isAdmin || !selectedNodeId) return;
        const selected = nodes.find(n => n.id === selectedNodeId);
        if (!selected) return;

        let formSpouseId = ''; let formParentId = '';
        if (relationType === 'parent') {
           const existingParents = edges.filter(e => e.type === 'child' && e.target === selected.id);
           if (existingParents.length === 1) formSpouseId = existingParents[0].source;
        } else if (relationType === 'spouse') { formSpouseId = selected.id; } 
        else if (relationType === 'child') { formParentId = selected.id; }

        setPendingRelation({ type: relationType, sourceId: selected.id });
        setEditingNodeId(null);
        setFormData({ name: '', nickname: '', sex: 'Unknown', dob: '', dod: '', address: '', notes: '', spouseId: formSpouseId, parentId: formParentId });
        setIsModalOpen(true);
      };

      const selectedNode = nodes.find(n => n.id === selectedNodeId);

      return (
        <div className="w-full h-screen flex flex-col bg-gray-50 text-gray-800 font-sans overflow-hidden fade-in">
          
          {/* Top Error Banner */}
          {firebaseError && (
             <div className="absolute top-16 left-1/2 transform -translate-x-1/2 bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded z-[100] shadow-xl max-w-2xl w-[90%] flex justify-between items-start">
                 <div>
                    <strong className="font-bold block">Database Error</strong>
                    <span className="block mt-1 text-sm">{firebaseError}</span>
                 </div>
                 <button onClick={() => setFirebaseError(null)} className="text-red-700 font-bold ml-4">✕</button>
             </div>
          )}

          {/* Application Header */}
          <header className="bg-white shadow-sm px-4 md:px-6 py-3 flex items-center justify-between z-50 relative border-b border-gray-200">
            <div className="flex flex-col md:flex-row md:items-center space-y-1 md:space-y-0 md:space-x-4">
              <div className="flex items-center space-x-2">
                <Users className="text-blue-600 w-5 h-5 md:w-6 md:h-6" />
                <h1 className="text-lg md:text-xl font-bold truncate">Family Organizer</h1>
              </div>
              
              <div className="flex items-center space-x-2">
                <button 
                  onClick={() => !isAdmin && setIsLoginModalOpen(true)}
                  className={`text-xs md:text-sm font-semibold px-2 py-1 rounded transition-colors ${isAdmin ? 'text-green-700 bg-green-50' : 'text-blue-600 hover:bg-blue-50 cursor-pointer underline decoration-blue-200'}`}
                  title={isAdmin ? 'Logged in as Admin' : 'Click to Login to Back Office'}
                >
                  {getGreeting()}!
                </button>
                
                <div className={`hidden md:flex items-center text-[10px] md:text-xs px-2 py-0.5 rounded-full border ${isAdmin ? 'bg-green-50 text-green-700 border-green-200' : 'bg-gray-100 text-gray-600 border-gray-200'}`}>
                  {isAdmin ? <Cloud className="w-3 h-3 mr-1" /> : <Eye className="w-3 h-3 mr-1" />}
                  {syncStatus}
                </div>
              </div>
            </div>

            <div className="flex items-center space-x-2 md:space-x-3">
              {/* View Toggle */}
              <div className="flex bg-gray-100 p-1 rounded-lg border border-gray-200">
                <button onClick={() => setViewMode('graph')} className={`p-1.5 md:px-3 md:py-1.5 rounded-md flex items-center transition-colors ${viewMode==='graph'?'bg-white shadow-sm font-medium':'text-gray-500 hover:text-gray-700'}`}>
                  <DiagramIcon className="w-4 h-4 md:mr-1" /> <span className="hidden md:inline text-sm">Graph</span>
                </button>
                <button onClick={() => setViewMode('table')} className={`p-1.5 md:px-3 md:py-1.5 rounded-md flex items-center transition-colors ${viewMode==='table'?'bg-white shadow-sm font-medium':'text-gray-500 hover:text-gray-700'}`}>
                  <ListIcon className="w-4 h-4 md:mr-1" /> <span className="hidden md:inline text-sm">Table</span>
                </button>
              </div>

              <div className="w-px h-6 bg-gray-300"></div>

              {isAdmin && (
                <>
                  <button onClick={() => handleOpenModal()} className="flex items-center space-x-1 px-2 md:px-4 py-1.5 md:py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium shadow-sm">
                    <Plus className="w-4 h-4" />
                    <span className="hidden sm:inline">Add Member</span>
                  </button>
                  <button onClick={handleLogout} className="p-1.5 md:p-2 text-gray-500 hover:bg-gray-100 rounded-lg transition-colors" title="Logout">
                    <LogOut className="w-4 h-4 md:w-5 md:h-5 text-red-500" />
                  </button>
                </>
              )}
            </div>
          </header>

          {}
          <div className="flex-1 relative overflow-hidden bg-slate-50">
            {viewMode === 'graph' ? (
              // --- GRAPH VIEW (CANVAS) ---
              <div 
                ref={canvasRef}
                className={`w-full h-full absolute inset-0 ${isPanning ? 'cursor-grabbing' : 'cursor-grab'}`}
                onPointerDown={handlePointerDownCanvas}
                onPointerMove={handlePointerMove}
                onPointerUp={handlePointerUp}
                onPointerLeave={handlePointerUp}
              >
                <div className="absolute inset-0 pointer-events-none opacity-[0.15]" style={{ backgroundImage: `radial-gradient(circle, #64748b 1px, transparent 1px)`, backgroundSize: '24px 24px', backgroundPosition: `${pan.x}px ${pan.y}px` }}></div>

                <div className="absolute origin-top-left" style={{ transform: `translate(${pan.x}px, ${pan.y}px)` }}>
                  <svg className="absolute overflow-visible pointer-events-none" style={{ left: 0, top: 0, width: '1px', height: '1px' }}>
                    {renderEdges()}
                  </svg>
                  {nodes.map(node => (
                    <div key={node.id} className="node-element absolute">
                      <FamilyNode node={node} isSelected={selectedNodeId === node.id} onSelect={(n) => setSelectedNodeId(n.id)} onPointerDown={handlePointerDownNode} />
                    </div>
                  ))}
                </div>

                {/* Smart Graph Context Menu for Selected Node */}
                {selectedNode && (
                  <div className="absolute z-50 fade-in pointer-events-none smart-toolbar" style={{ left: selectedNode.x + pan.x, top: selectedNode.y + pan.y, width: NODE_WIDTH, height: NODE_HEIGHT }}>
                      {/* Top Action Pill (Admin Only) */}
                      {isAdmin && (
                        <div className="absolute pointer-events-auto flex items-center bg-gray-900 text-white rounded-lg shadow-xl px-2 py-1 gap-1 backdrop-blur-md -top-[52px] left-1/2 transform -translate-x-1/2 whitespace-nowrap border border-gray-700">
                           <span className="text-xs font-semibold px-2 border-r border-gray-600 truncate max-w-[120px]">{selectedNode.data.name || 'Unknown'}</span>
                           <button onClick={() => handleOpenModal(selectedNode)} className="p-1.5 hover:bg-gray-700 rounded transition-all text-gray-200 hover:text-white"><Edit className="w-3.5 h-3.5" /></button>
                           <button onClick={() => handleDeleteMember(selectedNode.id)} className="p-1.5 hover:bg-red-500/80 rounded transition-all text-red-300 hover:text-white"><Trash2 className="w-3.5 h-3.5" /></button>
                           <div className="w-px h-3 bg-gray-600 mx-1"></div>
                           <button onClick={() => setSelectedNodeId(null)} className="p-1.5 hover:bg-gray-700 rounded transition-all text-gray-300 hover:text-white"><X className="w-3.5 h-3.5" /></button>
                        </div>
                      )}

                      {/* Snap-to-Edge Creation Handles (Admin Only) */}
                      {isAdmin && (
                         <>
                           <button onClick={() => handleAddRelativeInit('parent')} className="absolute pointer-events-auto w-6 h-6 bg-blue-500 border-2 border-white text-white rounded-full flex items-center justify-center shadow-lg hover:bg-blue-600 hover:scale-110 transition-all z-40 left-1/2 top-0 transform -translate-x-1/2 -translate-y-1/2" title="Add Parent"><Plus className="w-3 h-3" /></button>
                           <button onClick={() => handleAddRelativeInit('spouse')} className="absolute pointer-events-auto w-6 h-6 bg-pink-500 border-2 border-white text-white rounded-full flex items-center justify-center shadow-lg hover:bg-pink-600 hover:scale-110 transition-all z-40 right-0 top-1/2 transform translate-x-1/2 -translate-y-1/2" title="Add Spouse"><Plus className="w-3 h-3" /></button>
                           <button onClick={() => handleAddRelativeInit('child')} className="absolute pointer-events-auto w-6 h-6 bg-indigo-500 border-2 border-white text-white rounded-full flex items-center justify-center shadow-lg hover:bg-indigo-600 hover:scale-110 transition-all z-40 left-1/2 bottom-0 transform -translate-x-1/2 translate-y-1/2" title="Add Child"><Plus className="w-3 h-3" /></button>
                         </>
                      )}

                      {/* View-Only Details Card */}
                      <div className="absolute pointer-events-auto bg-white/95 backdrop-blur-md rounded-xl shadow-2xl border border-gray-200 p-3 w-64 z-20 left-1/2 bottom-[-32px] transform -translate-x-1/2 translate-y-full">
                         <div className="text-sm text-gray-700 space-y-2">
                            {selectedNode.data.dob && <p className="flex justify-between border-b border-gray-100 pb-1"><span className="text-gray-400 text-[10px] uppercase font-bold tracking-wider">DOB</span><span className="font-medium text-xs">{selectedNode.data.dob}</span></p>}
                            {selectedNode.data.dod && <p className="flex justify-between border-b border-gray-100 pb-1"><span className="text-gray-400 text-[10px] uppercase font-bold tracking-wider">Died</span><span className="font-medium text-xs">{selectedNode.data.dod}</span></p>}
                            {selectedNode.data.address && <p className="flex justify-between border-b border-gray-100 pb-1"><span className="text-gray-400 text-[10px] uppercase font-bold tracking-wider">Address</span><span className="font-medium text-xs text-right max-w-[140px] truncate" title={selectedNode.data.address}>{selectedNode.data.address}</span></p>}
                            {selectedNode.data.notes && <div className="mt-1 pt-1"><span className="text-gray-400 text-[10px] uppercase font-bold tracking-wider block mb-0.5">Notes</span><p className="text-xs text-gray-600 leading-relaxed whitespace-pre-wrap">{selectedNode.data.notes}</p></div>}
                            {!selectedNode.data.dob && !selectedNode.data.dod && !selectedNode.data.address && !selectedNode.data.notes && <p className="text-xs text-gray-400 text-center italic">No additional details recorded.</p>}
                         </div>
                      </div>
                  </div>
                )}
              </div>
            ) : (
              // --- TABLE VIEW (LIST) ---
              <div className="w-full h-full overflow-y-auto p-4 md:p-8 bg-white">
                <div className="max-w-6xl mx-auto">
                  <div className="mb-6 flex justify-between items-center">
                    <h2 className="text-xl font-bold text-gray-800">Member Directory</h2>
                    <span className="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full border border-gray-200">Total: {nodes.length}</span>
                  </div>
                  <div className="overflow-x-auto border border-gray-200 rounded-xl shadow-sm">
                    <table className="w-full text-left border-collapse whitespace-nowrap">
                      <thead>
                        <tr className="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-200">
                          <th className="px-4 py-3 font-semibold">Full Name</th>
                          <th className="px-4 py-3 font-semibold">Nickname</th>
                          <th className="px-4 py-3 font-semibold text-center">Sex</th>
                          <th className="px-4 py-3 font-semibold">DOB</th>
                          <th className="px-4 py-3 font-semibold">DOD</th>
                          <th className="px-4 py-3 font-semibold">Address</th>
                          {isAdmin && <th className="px-4 py-3 font-semibold text-right">Actions</th>}
                        </tr>
                      </thead>
                      <tbody className="text-sm text-gray-700 divide-y divide-gray-100">
                        {nodes.length === 0 ? (
                          <tr><td colSpan="7" className="px-4 py-8 text-center text-gray-400 italic">No members found.</td></tr>
                        ) : (
                          nodes.map(node => (
                            <tr key={node.id} className="hover:bg-blue-50/50 transition-colors">
                              <td className="px-4 py-3 font-medium text-gray-900">{node.data.name || '-'}</td>
                              <td className="px-4 py-3">{node.data.nickname || '-'}</td>
                              <td className="px-4 py-3 text-center">
                                {node.data.sex === 'M' ? <span className="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs font-bold">M</span> : 
                                 node.data.sex === 'F' ? <span className="bg-pink-100 text-pink-700 px-2 py-0.5 rounded text-xs font-bold">F</span> : '-'}
                              </td>
                              <td className="px-4 py-3">{node.data.dob || '-'}</td>
                              <td className="px-4 py-3">{node.data.dod || '-'}</td>
                              <td className="px-4 py-3 truncate max-w-[150px]" title={node.data.address}>{node.data.address || '-'}</td>
                              {isAdmin && (
                                <td className="px-4 py-3 text-right">
                                  <button onClick={() => handleOpenModal(node)} className="text-blue-600 hover:text-blue-800 p-1 mx-1"><Edit className="w-4 h-4 inline" /></button>
                                  <button onClick={() => handleDeleteMember(node.id)} className="text-red-500 hover:text-red-700 p-1 mx-1"><Trash2 className="w-4 h-4 inline" /></button>
                                </td>
                              )}
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </div>

          {}
          {/* Admin Login Modal */}
          {isLoginModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4 fade-in">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
                <div className="flex justify-between items-center px-6 py-4 border-b border-gray-100 bg-gray-50">
                  <h2 className="text-lg font-bold text-gray-800">Back Office Login</h2>
                  <button onClick={() => setIsLoginModalOpen(false)} className="text-gray-400 hover:text-gray-600 bg-gray-200/50 hover:bg-gray-200 rounded-full p-1"><X className="w-5 h-5" /></button>
                </div>
                <form onSubmit={handleLoginSubmit} className="p-6 space-y-4">
                  <div className="text-sm text-gray-600 mb-4 bg-blue-50 p-3 rounded-lg border border-blue-100">
                    Welcome Admin. Please sign in to edit the family tree directory.
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Admin Email</label>
                    <input type="email" value={loginData.email} onChange={e => setLoginData({...loginData, email: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" readOnly />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Password</label>
                    <input type="password" value={loginData.password} onChange={e => setLoginData({...loginData, password: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" required autoFocus placeholder="Enter admin password" />
                  </div>
                  <div className="pt-2">
                    <button type="submit" className="w-full py-2.5 rounded-lg shadow-sm text-white bg-blue-600 hover:bg-blue-700 font-medium transition-colors">Access Back Office</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Add/Edit Member Modal (Admin Only) */}
          {isModalOpen && isAdmin && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4 fade-in">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden max-h-[95vh] flex flex-col">
                <div className="flex justify-between items-center px-6 py-4 border-b border-gray-100 bg-gray-50 shrink-0">
                  <h2 className="text-lg font-bold text-gray-800">
                    {editingNodeId ? 'Edit Profile' : pendingRelation ? `Add ${pendingRelation.type.charAt(0).toUpperCase() + pendingRelation.type.slice(1)}` : 'Add New Member'}
                  </h2>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600 bg-gray-200/50 hover:bg-gray-200 rounded-full p-1"><X className="w-5 h-5" /></button>
                </div>
                
                <div className="overflow-y-auto p-6 flex-1">
                  <form id="memberForm" onSubmit={handleSaveMember} className="space-y-5">
                    
                    {/* Basic Info */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div>
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Full Name <span className="text-red-500">*</span></label>
                        <input type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-medium" required placeholder="e.g. John Doe" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Nickname</label>
                        <input type="text" value={formData.nickname} onChange={e => setFormData({...formData, nickname: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="e.g. Johnny" />
                      </div>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                      <div>
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Sex (M/F)</label>
                        <select value={formData.sex} onChange={e => setFormData({...formData, sex: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                          <option value="Unknown">Select...</option><option value="M">Male (M)</option><option value="F">Female (F)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Date of Birth</label>
                        <input type="date" value={formData.dob} onChange={e => setFormData({...formData, dob: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Date of Died</label>
                        <input type="date" value={formData.dod} onChange={e => setFormData({...formData, dod: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" />
                      </div>
                    </div>

                    <div className="border-t border-gray-100 pt-5">
                      <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Current Address</label>
                      <input type="text" value={formData.address} onChange={e => setFormData({...formData, address: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" placeholder="Full residential address..." />
                    </div>

                    {/* Relationships */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5 bg-blue-50/50 p-4 rounded-xl border border-blue-100 mt-2">
                      <div>
                        <label className="block text-xs font-bold text-blue-700 uppercase tracking-wide mb-1 flex items-center"><Plus className="w-3 h-3 mr-1"/> Married with</label>
                        <select value={formData.spouseId || ''} onChange={e => setFormData({...formData, spouseId: e.target.value})} className="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                          <option value="">-- None --</option>
                          {nodes.filter(n => n.id !== editingNodeId).map(n => <option key={n.id} value={n.id}>{n.data.name || 'Unnamed'} {n.data.nickname ? `(${n.data.nickname})` : ''}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-indigo-700 uppercase tracking-wide mb-1 flex items-center"><Plus className="w-3 h-3 mr-1"/> A Child of</label>
                        <select value={formData.parentId || ''} onChange={e => setFormData({...formData, parentId: e.target.value})} className="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                          <option value="">-- None --</option>
                          {nodes.filter(n => n.id !== editingNodeId).map(n => <option key={n.id} value={n.id}>{n.data.name || 'Unnamed'} {n.data.nickname ? `(${n.data.nickname})` : ''}</option>)}
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Notes</label>
                      <textarea value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} rows={3} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none" placeholder="Additional details, biography, etc..." />
                    </div>

                  </form>
                </div>

                <div className="flex justify-end space-x-3 px-6 py-4 border-t border-gray-100 bg-gray-50 shrink-0">
                  <button type="button" onClick={() => setIsModalOpen(false)} className="px-5 py-2.5 rounded-lg text-gray-700 bg-white border border-gray-200 hover:bg-gray-100 font-medium text-sm transition-colors">Cancel</button>
                  <button type="submit" form="memberForm" className="px-5 py-2.5 rounded-lg shadow-sm text-white bg-blue-600 hover:bg-blue-700 font-medium text-sm transition-colors flex items-center">
                    <Cloud className="w-4 h-4 mr-2" /> Save Member
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FamilyTreeApp />);
  </script>
</body>
</html>
