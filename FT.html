<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Tree Organizer</title>
  
  <!-- NEW: Google Fonts (Khmer) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&family=Siemreap&display=swap" rel="stylesheet">
  
  <!-- External Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
      tailwind.config = {
          theme: {
              extend: {
                  fontFamily: {
                      // MODIFIED: Added Khmer fonts to the default sans stack
                      // 'Moul' is used for headers, 'Battambang' for body

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    /* Custom Scrollbar for Table & Modals */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function generateId() {
      return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    }

    const IconBase = ({ children, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const Users = ({className}) => <IconBase className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>;
    const Edit = ({className}) => <IconBase className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></IconBase>;
    const Trash2 = ({className}) => <IconBase className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>;
    const X = ({className}) => <IconBase className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;
    const Plus = ({className}) => <IconBase className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></IconBase>;
    const Cloud = ({className}) => <IconBase className={className}><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></IconBase>;
    const ShareIcon = ({className}) => <IconBase className={className}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></IconBase>;
    const Eye = ({className}) => <IconBase className={className}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></IconBase>;
    const LogOut = ({className}) => <IconBase className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></IconBase>;
    const ListIcon = ({className}) => <IconBase className={className}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></IconBase>;
    const DiagramIcon = ({className}) => <IconBase className={className}><rect x="8" y="2" width="8" height="6" rx="1"/><path d="M12 8v4"/><path d="M8 12H4v2"/><path d="M16 12h4v2"/><rect x="2" y="14" width="8" height="6" rx="1"/><rect x="14" y="14" width="8" height="6" rx="1"/></IconBase>;
    const ZoomInIcon = ({className}) => <IconBase className={className}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></IconBase>;
    const ZoomOutIcon = ({className}) => <IconBase className={className}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></IconBase>;
    const MaximizeIcon = ({className}) => <IconBase className={className}><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></IconBase>;
    const Search = ({className}) => <IconBase className={className}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></IconBase>;
    
    // NEW: Sex Identification Icons
    const MaleIcon = ({className}) => <IconBase className={className}><circle cx="10" cy="14" r="5"/><line x1="13.5" y1="10.5" x2="21" y2="3"/><line x1="16" y1="3" x2="21" y2="3"/><line x1="21" y1="3" x2="21" y2="8"/></IconBase>;
    const FemaleIcon = ({className}) => <IconBase className={className}><circle cx="12" cy="9" r="5"/><line x1="12" y1="14" x2="12" y2="22"/><line x1="9" y1="18" x2="15" y2="18"/></IconBase>;

    const NODE_WIDTH = 160;
    const NODE_HEIGHT = 75;
    const ADMIN_UID = 'TOqcYR4pHjd4H2oI2LslDyENsKw1';

    // NEW: Smart Family Color Grouping Generator
    const getFamilyColor = (p1Id, p2Id) => {
        // Creates a stable ID string from the parent(s) so the family always gets the exact same color
        const combined = [p1Id, p2Id].filter(Boolean).sort().join('-');
        const colors = [
          '#4f46e5', // Indigo
          '#0284c7', // Light Blue
          '#0d9488', // Teal
          '#059669', // Emerald
          '#d97706', // Amber
          '#e11d48', // Rose
          '#c026d3', // Fuchsia
          '#7c3aed', // Violet
          '#2563eb', // Blue
          '#db2777'  // Pink
        ];
        let hash = 0;
        for (let i = 0; i < combined.length; i++) {
            hash = combined.charCodeAt(i) + ((hash << 5) - hash);
        }
        return colors[Math.abs(hash) % colors.length];
    };

    const FamilyNode = ({ node, isSelected, onSelect, onPointerDown, isSearched, isDimmed }) => {
      const { data } = node;
      const isDeceased = data.isDeceased || (data.dod && data.dod !== '');
      
      let bgColor = 'bg-gray-100';
      let borderColor = 'border-gray-300';
      if (data.sex === 'M') {
        bgColor = 'bg-blue-50';
        borderColor = 'border-blue-300';
      } else if (data.sex === 'F') {
        bgColor = 'bg-pink-50';
        borderColor = 'border-pink-300';
      }

      // NEW: Search Highlight Logic
      const dimClass = isDimmed ? 'opacity-30 grayscale' : 'opacity-100';
      let ringClass = isSelected ? 'border-blue-600 ring-4 ring-blue-200 z-30' : `${borderColor} z-10`;
      if (isSearched && !isSelected) {
          ringClass = 'border-yellow-400 ring-4 ring-yellow-200 z-20 shadow-yellow-200/50 shadow-xl';
          bgColor = 'bg-yellow-50';
      }

      return (
        <div 
          className={`absolute shadow-md rounded-xl border-2 ${bgColor} ${ringClass} ${dimClass} cursor-grab active:cursor-grabbing select-none transition-all duration-300`}
          style={{ left: node.x, top: node.y, width: NODE_WIDTH, height: NODE_HEIGHT, touchAction: 'none' }}
          onPointerDown={(e) => onPointerDown(e, node.id)}
          onClick={(e) => { e.stopPropagation(); onSelect(node); }}
        >
          <div className="flex flex-col items-center justify-center h-full p-2 relative">
            <div className="font-bold text-gray-800 text-center truncate w-full flex-grow flex items-center justify-center text-lg md:text-xl">
              {data.sex === 'M' && <MaleIcon className="w-4 h-4 mr-1 text-blue-500 shrink-0" />}
              {data.sex === 'F' && <FemaleIcon className="w-4 h-4 mr-1 text-pink-500 shrink-0" />}
              <span className="truncate">{data.name || 'Unknown'}</span>
            </div>
            {data.nickname && <div className="text-xs font-semibold text-gray-600 truncate w-full text-center">"{data.nickname}"</div>}
            
            {(data.dob || data.dod) && (
              <div className="text-xs text-gray-500 mt-0.5 flex flex-col items-center w-full leading-tight shrink-0">
                 {data.dob && <span className="truncate w-full text-center">b: {data.dob}</span>}
                 {data.dod && <span className="truncate w-full text-center">d: {data.dod}</span>}
              </div>
            )}
            
            {isDeceased && <div className="absolute top-2 right-2 w-2.5 h-2.5 bg-gray-800 rounded-full border border-white shadow-sm" title="Deceased"></div>}
          </div>
        </div>
      );
    };

    function FamilyTreeApp() {
      // Core Data
      const [nodes, setNodes] = useState([]);
      const [edges, setEdges] = useState([]);
      
      // UI & View State
      const [viewMode, setViewMode] = useState('graph'); // 'graph' or 'table'
      const [selectedNodeId, setSelectedNodeId] = useState(null);
      const [dragInfo, setDragInfo] = useState(null);
      const [pan, setPan] = useState({ x: window.innerWidth > 768 ? 50 : -100, y: 50 });
      const [zoom, setZoom] = useState(1);
      const [isPanning, setIsPanning] = useState(false);
      const initialPinchDist = useRef(null);
      
      // Modals & Forms
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
      const [editingNodeId, setEditingNodeId] = useState(null);
      const [pendingRelation, setPendingRelation] = useState(null);
      const [formData, setFormData] = useState({ name: '', nickname: '', sex: 'Unknown', dob: '', dod: '', isDeceased: false, address: '', contact: '', notes: '', spouseId: '', parentId: '' });
      const [loginData, setLoginData] = useState({ email: 'jlw@jlw.com', password: '' });
      
      // NEW: Search State
      const [searchQuery, setSearchQuery] = useState('');

      // Firebase & Auth State
      const [isLoaded, setIsLoaded] = useState(false);
      const [syncStatus, setSyncStatus] = useState('Initializing...');
      const [firebaseInstances, setFirebaseInstances] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [firebaseError, setFirebaseError] = useState(null);
      const canvasRef = useRef(null);

      const getGreeting = () => {
        const hour = new Date().getHours();
        if (hour < 12) return 'Good Morning';
        if (hour < 18) return 'Good Afternoon';
        return 'Good Evening';
      };

      useEffect(() => {
        const initFirebase = async () => {
          try {
            setSyncStatus('Connecting...');
            const nativeImport = new Function('url', 'return import(url)');
            
            const { initializeApp } = await nativeImport('https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js');
            const { getFirestore, doc, getDoc, setDoc } = await nativeImport('https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js');
            const { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } = await nativeImport('https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js');

            const firebaseConfig = {
              apiKey: "AIzaSyBWjcR-oJ0RF0RuId_dDuQ_fJ4pUGwOykI",
              authDomain: "familytree-8fb37.firebaseapp.com",
              projectId: "familytree-8fb37",
              storageBucket: "familytree-8fb37.firebasestorage.app",
              messagingSenderId: "792607492944",
              appId: "1:792607492944:web:e9946edd9d481b82a53a55",
              measurementId: "G-5JN27TKQDS"
            };

            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const auth = getAuth(app);

            setFirebaseInstances({ db, auth, signInWithEmailAndPassword, signOut, setDoc, doc });

            // 1. Fetch data immediately for EVERYONE (Public View)
            const docRef = doc(db, 'artifacts', 'familytree-8fb37', 'public', 'data', 'members', 'treeData');
            try {
              const docSnap = await getDoc(docRef);
              if (docSnap.exists()) {
                const data = docSnap.data();
                if(data.nodes) setNodes(data.nodes);
                if(data.edges) setEdges(data.edges);
                setSyncStatus('Public View Mode');
              } else {
                setSyncStatus('No Tree Data Yet');
              }
            } catch (err) {
               console.error("Firestore Fetch Error:", err);
               setFirebaseError("Cannot read from database. " + err.message);
            } finally {
               setIsLoaded(true); // Always clear the loading state
            }

            // 2. Listen for Auth Changes in the background (Admin check)
            onAuthStateChanged(auth, (user) => {
              const isAdminUser = user && user.uid === ADMIN_UID;
              setIsAdmin(isAdminUser);
              
              if (isAdminUser) {
                setSyncStatus('Synced to Cloud');
                // If admin logs in and the tree is completely empty, initialize the root member
                setNodes(currentNodes => {
                  if (currentNodes.length === 0) {
                     return [{ id: 'root-1', x: Math.max(100, window.innerWidth/2 - NODE_WIDTH/2), y: 100, data: { name: 'Root Member', sex: 'M' } }];
                  }
                  return currentNodes;
                });
              } else {
                setSyncStatus('Public View Mode');
              }
            });

          } catch (error) {
            console.error("Firebase Init Error:", error);
            setFirebaseError(error.message);
            setSyncStatus('Connection Failed');
            setIsLoaded(true);
          }
        };
        initFirebase();
      }, []);

      useEffect(() => {
        if (!isLoaded || !isAdmin || !firebaseInstances) return;

        setSyncStatus('Saving...');
        const saveTimer = setTimeout(() => {
          const { db, setDoc, doc } = firebaseInstances;
          const docRef = doc(db, 'artifacts', 'familytree-8fb37', 'public', 'data', 'members', 'treeData');
          
          setDoc(docRef, { nodes, edges })
            .then(() => {
                setSyncStatus('Synced to Cloud');
                setFirebaseError(null);
            })
            .catch((error) => {
                setSyncStatus('Sync Error');
                setFirebaseError("Failed to save: " + error.message);
            });
        }, 1500); 

        return () => clearTimeout(saveTimer);
      }, [nodes, edges, isLoaded, isAdmin, firebaseInstances]);

      // Handle Mouse Wheel Zooming
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const handleWheel = (e) => {
          e.preventDefault(); 
          const delta = e.deltaY < 0 ? 0.1 : -0.1;
          applyZoom(delta, e.clientX, e.clientY);
        };
        canvas.addEventListener('wheel', handleWheel, { passive: false });
        return () => canvas.removeEventListener('wheel', handleWheel);
      }, [viewMode]); 

      const applyZoom = (delta, clientX, clientY) => {
        setZoom(prevZoom => {
          const newZoom = Math.max(0.15, Math.min(prevZoom + delta, 3));
          if (newZoom === prevZoom) return prevZoom;
          
          setPan(prevPan => {
            const pointerX = (clientX - prevPan.x) / prevZoom;
            const pointerY = (clientY - prevPan.y) / prevZoom;
            return {
              x: clientX - pointerX * newZoom,
              y: clientY - pointerY * newZoom
            };
          });
          return newZoom;
        });
      };

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        try {
          const { auth, signInWithEmailAndPassword } = firebaseInstances;
          await signInWithEmailAndPassword(auth, loginData.email, loginData.password);
          setIsLoginModalOpen(false);
          setLoginData({ ...loginData, password: '' });
          setFirebaseError(null);
        } catch (error) {
          setFirebaseError("Login failed: " + error.message);
        }
      };

      const handleLogout = async () => {
        try {
          const { auth, signOut } = firebaseInstances;
          await signOut(auth);
          setIsAdmin(false);
        } catch(e) {
          console.error(e);
        }
      };

      const handlePointerDownCanvas = (e) => {
        if (e.target.closest('.node-element') || e.target.closest('.smart-toolbar')) return;
        setIsPanning(true);
        setSelectedNodeId(null);
        setDragInfo({ type: 'pan', startX: e.clientX, startY: e.clientY, startPanX: pan.x, startPanY: pan.y });
      };

      const handlePointerDownNode = (e, id) => {
        e.stopPropagation();
        setSelectedNodeId(id);
        if (!isAdmin) return; 
        const node = nodes.find(n => n.id === id);
        setDragInfo({ type: 'node', id, startX: e.clientX, startY: e.clientY, nodeStartX: node.x, nodeStartY: node.y });
      };

      const handlePointerMove = (e) => {
        if (!dragInfo) return;
        if (dragInfo.type === 'node' && isAdmin) {
          const dx = (e.clientX - dragInfo.startX) / zoom;
          const dy = (e.clientY - dragInfo.startY) / zoom;
          setNodes(nds => nds.map(n => n.id === dragInfo.id ? { ...n, x: dragInfo.nodeStartX + dx, y: dragInfo.nodeStartY + dy } : n));
        } else if (dragInfo.type === 'pan') {
          const dx = e.clientX - dragInfo.startX;
          const dy = e.clientY - dragInfo.startY;
          setPan({ x: dragInfo.startPanX + dx, y: dragInfo.startPanY + dy });
        }
      };

      const handlePointerUp = () => { setDragInfo(null); setIsPanning(false); };

      const handleTouchMove = (e) => {
        if (e.touches.length === 2) {
          const t1 = e.touches[0]; const t2 = e.touches[1];
          const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
          if (initialPinchDist.current) {
            const delta = (dist - initialPinchDist.current) * 0.0015; // Vastly reduced sensitivity for smoothness
            applyZoom(delta, (t1.clientX + t2.clientX)/2, (t1.clientY + t2.clientY)/2);
            initialPinchDist.current = dist;
          } else {
            initialPinchDist.current = dist;
          }
        }
      };
      const handleTouchEnd = () => { initialPinchDist.current = null; };

      const renderEdges = () => {
        return edges.map(edge => {
          const source = nodes.find(n => n.id === edge.source);
          const target = nodes.find(n => n.id === edge.target);
          if (!source || !target) return null;

          if (edge.type === 'spouse') {
            const isSourceLeft = source.x < target.x;
            const leftNode = isSourceLeft ? source : target;
            const rightNode = isSourceLeft ? target : source;
            
            // Connect from right side of the left node to the left side of the right node
            const startX = leftNode.x + NODE_WIDTH;
            const startY = leftNode.y + NODE_HEIGHT / 2;
            const endX = rightNode.x;
            const endY = rightNode.y + NODE_HEIGHT / 2;
            
            // Smart curved line for spouse
            const ctrlX = (startX + endX) / 2;
            const pathD = `M ${startX} ${startY} C ${ctrlX} ${startY}, ${ctrlX} ${endY}, ${endX} ${endY}`;

            return <path key={edge.id} d={pathD} stroke="#ec4899" strokeWidth="3" strokeDasharray="6,6" fill="none" className="transition-all duration-300" strokeLinecap="round" />;
          } else {
            const childEdges = edges.filter(e => e.target === edge.target && e.type === 'child');
            let startX = source.x + NODE_WIDTH / 2;
            let startY = source.y + NODE_HEIGHT;
            let familyColorId = source.id;
            let p2Id = null;

            if (childEdges.length === 2) {
              if (edge.id !== childEdges[0].id) return null; 
              const p1 = nodes.find(n => n.id === childEdges[0].source);
              const p2 = nodes.find(n => n.id === childEdges[1].source);
              if (p1 && p2) {
                // SMARTER PARENT ROUTING: Connect from the center of both parents
                startX = (p1.x + p2.x) / 2 + NODE_WIDTH / 2;
                startY = (p1.y + p2.y) / 2 + NODE_HEIGHT / 2;
                familyColorId = p1.id;
                p2Id = p2.id;
              }
            }

            const targetX = target.x + NODE_WIDTH / 2;
            const targetY = target.y;
            
            // 1. Assign a unique group color for this specific family
            const edgeColor = getFamilyColor(familyColorId, p2Id);

            // 2. Beautiful Orthogonal (Right-Angle) Routing
            let pathD;
            
            // If they accidentally drag the child above the parents, fall back to a smooth curve
            if (targetY < startY + 40) {
                pathD = `M ${startX} ${startY} C ${startX} ${startY + 50}, ${targetX} ${targetY - 50}, ${targetX} ${targetY}`;
            } 
            // If the child is directly underneath the parent (straight vertical line)
            else if (Math.abs(startX - targetX) < 5) {
                pathD = `M ${startX} ${startY} L ${targetX} ${targetY}`;
            } 
            // Draw a perfect Family-Tree bracket with rounded corners
            else {
                const midY = startY + 45; // Uniform horizontal bar where all siblings will overlap/merge perfectly
                const r = Math.min(12, Math.abs(targetX - startX) / 2, Math.abs(targetY - midY) / 2); // Rounded corner radius
                const dirX = targetX > startX ? 1 : -1;
                
                pathD = `M ${startX} ${startY} 
                         L ${startX} ${midY - r} 
                         Q ${startX} ${midY} ${startX + r * dirX} ${midY} 
                         L ${targetX - r * dirX} ${midY} 
                         Q ${targetX} ${midY} ${targetX} ${midY + r} 
                         L ${targetX} ${targetY}`;
            }

            return (
              <g key={edge.id}>
                <path d={pathD} stroke={edgeColor} strokeWidth="3" fill="none" className="transition-all duration-300" strokeLinecap="round" strokeLinejoin="round" />
                <circle cx={targetX} cy={targetY - 2} r="5" fill={edgeColor} className="transition-all duration-300" />
              </g>
            );
          }
        });
      };

      const getSafePosition = (startX, startY, currentNodes, excludeNodeId = null) => {
        let safeX = startX;
        let safeY = startY;
        let overlap = true;
        let attempts = 0;
        
        while (overlap && attempts < 50) {
          overlap = false;
          for (let n of currentNodes) {
            if (n.id === excludeNodeId) continue;
            if (Math.abs(n.x - safeX) < NODE_WIDTH + 20 && Math.abs(n.y - safeY) < NODE_HEIGHT + 20) {
              safeX += NODE_WIDTH + 40; 
              overlap = true;
              break;
            }
          }
          attempts++;
        }
        return { x: safeX, y: safeY };
      };

      const handleOpenModal = (node = null) => {
        if (!isAdmin) return;
        if (node) {
          setEditingNodeId(node.id);
          const spouseEdge = edges.find(e => e.type === 'spouse' && (e.source === node.id || e.target === node.id));
          const parentEdge = edges.find(e => e.type === 'child' && e.target === node.id);
          setFormData({ 
            ...node.data, 
            isDeceased: node.data.isDeceased || !!node.data.dod,
            spouseId: spouseEdge ? (spouseEdge.source === node.id ? spouseEdge.target : spouseEdge.source) : '', 
            parentId: parentEdge ? parentEdge.source : '' 
          });
        } else {
          setEditingNodeId(null);
          setPendingRelation(null);
          setFormData({ name: '', nickname: '', sex: 'Unknown', dob: '', dod: '', isDeceased: false, address: '', contact: '', notes: '', spouseId: '', parentId: '' });
        }
        setIsModalOpen(true);
      };

      const handleSaveMember = (e) => {
        e.preventDefault();
        let nodeId = editingNodeId || generateId();
        
        const nodeDataToSave = { ...formData };
        if (!nodeDataToSave.isDeceased) {
           nodeDataToSave.dod = ''; // Clear Date of Death if person is marked alive
        }
        const newSpouseId = nodeDataToSave.spouseId;
        const newParentId = nodeDataToSave.parentId;
        delete nodeDataToSave.spouseId;
        delete nodeDataToSave.parentId;

        let extraEdges = [];

        if (editingNodeId) {
          setNodes(nds => nds.map(n => n.id === editingNodeId ? { ...n, data: nodeDataToSave } : n));
        } else {
          let startX, startY;
          if (pendingRelation) {
              const source = nodes.find(n => n.id === pendingRelation.sourceId);
              startX = source.x; startY = source.y;

              if (pendingRelation.type === 'parent') {
                  const existingParents = edges.filter(e => e.type === 'child' && e.target === source.id);
                  if (existingParents.length === 1) {
                      const firstParent = nodes.find(n => n.id === existingParents[0].source);
                      if (firstParent) { startX = firstParent.x + NODE_WIDTH + 60; startY = firstParent.y; }
                  } else { startY -= 140; }
                  extraEdges.push({ id: generateId(), source: nodeId, target: source.id, type: 'child' });
              } else if (pendingRelation.type === 'spouse') {
                  startX += NODE_WIDTH + 60;
              } else if (pendingRelation.type === 'child') {
                  startY += 140;
                  let parentCenterX = source.x;
                  
                  const spouseEdge = edges.find(e => e.type === 'spouse' && (e.source === source.id || e.target === source.id));
                  if (spouseEdge) {
                      const spouseId = spouseEdge.source === source.id ? spouseEdge.target : spouseEdge.source;
                      const spouseNode = nodes.find(n => n.id === spouseId);
                      if (spouseNode) parentCenterX = (source.x + spouseNode.x) / 2;
                  }
                  
                  // Smart Placement: Find existing siblings to space the new child properly
                  const siblingEdges = edges.filter(e => e.type === 'child' && e.source === source.id);
                  const sibCount = siblingEdges.length;
                  
                  // Shift to the right based on siblings to fan them out beautifully
                  startX = parentCenterX + (sibCount * (NODE_WIDTH + 30));
              }
          } else {
              const selected = nodes.find(n => n.id === selectedNodeId);
              startX = selected ? selected.x + NODE_WIDTH + 40 : (-pan.x + window.innerWidth / 2) / zoom - NODE_WIDTH/2; 
              startY = selected ? selected.y : (-pan.y + window.innerHeight / 2) / zoom - NODE_HEIGHT/2;
          }
          
          const pos = getSafePosition(startX, startY, nodes);
          setNodes(nds => [...nds, { id: nodeId, x: pos.x, y: pos.y, data: nodeDataToSave }]);
        }
        
        // Relationship Syncing
        setEdges(eds => {
          let newEdges = [...eds];
          if (extraEdges.length > 0) newEdges.push(...extraEdges);
          
          // Sync Spouse
          const spouseEdgeIdx = newEdges.findIndex(edge => edge.type === 'spouse' && (edge.source === nodeId || edge.target === nodeId));
          const oldSpouseId = spouseEdgeIdx !== -1 ? (newEdges[spouseEdgeIdx].source === nodeId ? newEdges[spouseEdgeIdx].target : newEdges[spouseEdgeIdx].source) : '';
          if (oldSpouseId !== newSpouseId) {
              if (spouseEdgeIdx !== -1) newEdges.splice(spouseEdgeIdx, 1);
              if (newSpouseId) newEdges.push({ id: generateId(), source: nodeId, target: newSpouseId, type: 'spouse' });
          }
          
          // Sync Parent
          const parentEdges = newEdges.filter(edge => edge.type === 'child' && edge.target === nodeId);
          const oldParentId = parentEdges.length > 0 ? parentEdges[0].source : '';
          if (oldParentId !== newParentId) {
              newEdges = newEdges.filter(edge => !(edge.type === 'child' && edge.target === nodeId));
              if (newParentId) {
                  newEdges.push({ id: generateId(), source: newParentId, target: nodeId, type: 'child' });
                  const parentSpouse = newEdges.find(e => e.type === 'spouse' && (e.source === newParentId || e.target === newParentId));
                  if (parentSpouse) {
                      const pSpouseId = parentSpouse.source === newParentId ? parentSpouse.target : parentSpouse.source;
                      newEdges.push({ id: generateId(), source: pSpouseId, target: nodeId, type: 'child' });
                  }
              }
          }
          return newEdges;
        });

        setPendingRelation(null);
        setIsModalOpen(false);
      };

      const handleDeleteMember = (nodeId) => {
        if (!isAdmin) return;
        setNodes(nds => nds.filter(n => n.id !== nodeId));
        setEdges(eds => eds.filter(e => e.source !== nodeId && e.target !== nodeId));

        } else if (relationType === 'spouse') { formSpouseId = selected.id; }

        setPendingRelation({ type: relationType, sourceId: selected.id });

        setFormData({ name: '', nickname: '', sex: 'Unknown', dob: '', dod: '', isDeceased: false, address: '', contact: '', notes: '', spouseId: formSpouseId, parentId: formParentId });

              <div className="flex items-center space-x-2">

                <div className={`hidden md:flex items-center text-xs md:text-sm px-2 py-0.5 rounded-full border ${isAdmin ? 'bg-green-50 text-green-700 border-green-200' : 'bg-gray-100 text-gray-600 border-gray-200'}`}>
                  {isAdmin ? <Cloud className="w-3 h-3 mr-1" /> : <Eye className="w-3 h-3 mr-1" />}
                  {syncStatus}

              </div>
            </div>

            <div className="flex flex-wrap sm:flex-nowrap items-center justify-end gap-2 md:gap-3 w-full md:w-auto">
              
              {/* NEW: Search Box */}
              <div className="relative flex items-center w-full sm:w-auto order-3 sm:order-none mt-2 sm:mt-0">

                <input

                  {nodes.map(node => {
                    // NEW: Calculate Search Visibility
                    const q = searchQuery.toLowerCase();
                    const isSearched = q && ((node.data.name||'').toLowerCase().includes(q) || (node.data.nickname||'').toLowerCase().includes(q) || (node.data.contact||'').toLowerCase().includes(q));
                    const isDimmed = q && !isSearched;
                    
                    return (
                      <div key={node.id} className="node-element absolute">
                        <FamilyNode node={node} isSelected={selectedNodeId === node.id} onSelect={(n) => setSelectedNodeId(n.id)} onPointerDown={handlePointerDownNode} isSearched={isSearched} isDimmed={isDimmed} />

                {/* Smart Graph Context Menu for Selected Node */}
                {selectedNode && (
                  <div className="absolute z-50 fade-in pointer-events-none smart-toolbar" style={{ left: (selectedNode.x * zoom) + pan.x, top: (selectedNode.y * zoom) + pan.y, width: NODE_WIDTH * zoom, height: NODE_HEIGHT * zoom }}>
                      {/* Top Action Pill (Admin Only) */}

                      {isAdmin && (
                        <div className="absolute pointer-events-auto flex items-center bg-gray-900 text-white rounded-lg shadow-xl px-3 py-1.5 gap-2 backdrop-blur-md -top-[55px] left-1/2 transform -translate-x-1/2 whitespace-nowrap border border-gray-700">
                           <span className="text-sm font-semibold pr-3 border-r border-gray-600 truncate max-w-[150px]">{selectedNode.data.name || 'Unknown'}</span>
                           <button onClick={() => handleOpenModal(selectedNode)} className="p-2 hover:bg-gray-700 rounded transition-all text-gray-200 hover:text-white" title="Edit Member"><Edit className="w-4 h-4" /></button>
                           <button onClick={() => handleDeleteMember(selectedNode.id)} className="p-2 hover:bg-red-500/80 rounded transition-all text-red-300 hover:text-white" title="Delete Member"><Trash2 className="w-4 h-4" /></button>
                           <div className="w-px h-4 bg-gray-600 mx-1"></div>
                           <button onClick={() => setSelectedNodeId(null)} className="p-2 hover:bg-gray-700 rounded transition-all text-gray-300 hover:text-white" title="Deselect"><X className="w-4 h-4" /></button>
                        </div>
                      )}

                      {/* Snap-to-Edge Creation Handles (Admin Only) */}
                      {isAdmin && (
                         <>
                           <button onClick={() => handleAddRelativeInit('parent')} className="absolute pointer-events-auto w-7 h-7 bg-blue-500 border-2 border-white text-white rounded-full flex items-center justify-center shadow-lg hover:bg-blue-600 hover:scale-110 transition-all z-40 left-1/2 -top-3 transform -translate-x-1/2" title="Add Parent"><Plus className="w-4 h-4" /></button>
                           <button onClick={() => handleAddRelativeInit('spouse')} className="absolute pointer-events-auto w-7 h-7 bg-pink-500 border-2 border-white text-white rounded-full flex items-center justify-center shadow-lg hover:bg-pink-600 hover:scale-110 transition-all z-40 -right-3 top-1/2 transform -translate-y-1/2" title="Add Spouse"><Plus className="w-4 h-4" /></button>
                           <button onClick={() => handleAddRelativeInit('child')} className="absolute pointer-events-auto w-7 h-7 bg-indigo-500 border-2 border-white text-white rounded-full flex items-center justify-center shadow-lg hover:bg-indigo-600 hover:scale-110 transition-all z-40 left-1/2 -bottom-3 transform -translate-x-1/2" title="Add Child"><Plus className="w-4 h-4" /></button>
                         </>
                      )}

                      {/* View-Only Details Card */}
                      <div className="absolute pointer-events-auto bg-white/95 backdrop-blur-md rounded-xl shadow-2xl border border-gray-200 p-3 w-64 z-20 left-1/2 bottom-[-32px] transform -translate-x-1/2 translate-y-full">
                         <div className="text-base text-gray-700 space-y-2">
                            {selectedNode.data.dob && <p className="flex justify-between border-b border-gray-100 pb-1"><span className="text-gray-400 text-xs uppercase font-bold tracking-wider">DOB</span><span className="font-medium text-sm">{selectedNode.data.dob}</span></p>}
                            {selectedNode.data.dod && <p className="flex justify-between border-b border-gray-100 pb-1"><span className="text-gray-400 text-xs uppercase font-bold tracking-wider">Died</span><span className="font-medium text-sm">{selectedNode.data.dod}</span></p>}
                            {selectedNode.data.contact && <p className="flex justify-between border-b border-gray-100 pb-1"><span className="text-gray-400 text-xs uppercase font-bold tracking-wider">Contact</span><span className="font-medium text-sm text-right">{selectedNode.data.contact}</span></p>}
                            {selectedNode.data.address && <p className="flex justify-between border-b border-gray-100 pb-1"><span className="text-gray-400 text-xs uppercase font-bold tracking-wider">Address</span><span className="font-medium text-sm text-right max-w-[140px] truncate" title={selectedNode.data.address}>{selectedNode.data.address}</span></p>}
                            {selectedNode.data.notes && <div className="mt-1 pt-1"><span className="text-gray-400 text-xs uppercase font-bold tracking-wider block mb-0.5">Notes</span><p className="text-sm text-gray-600 leading-relaxed whitespace-pre-wrap">{selectedNode.data.notes}</p></div>}
                            {!selectedNode.data.dob && !selectedNode.data.dod && !selectedNode.data.contact && !selectedNode.data.address && !selectedNode.data.notes && <p className="text-sm text-gray-400 text-center italic">No additional details recorded.</p>}
                         </div>
                      </div>
                  </div>
                )}

                {/* Floating Zoom UI Controls */}
                <div className="absolute bottom-6 right-6 flex flex-col bg-white shadow-xl rounded-lg border border-gray-200 overflow-hidden z-40">
                   <button onClick={() => applyZoom(0.2, window.innerWidth/2, window.innerHeight/2)} className="p-3 text-gray-600 hover:bg-gray-50 hover:text-blue-600 border-b border-gray-100 transition-colors" title="Zoom In"><ZoomInIcon className="w-5 h-5" /></button>
                   <button onClick={() => { setZoom(1); setPan({x: window.innerWidth > 768 ? 50 : -100, y: 50}); }} className="p-3 text-gray-600 hover:bg-gray-50 hover:text-blue-600 border-b border-gray-100 transition-colors" title="Reset View"><MaximizeIcon className="w-5 h-5" /></button>

                  <div>
                    <label className="block text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">Password</label>
                    <input type="password" value={loginData.password} onChange={e => setLoginData({...loginData, password: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base" required autoFocus placeholder="Enter admin password" />
                  </div>
                  <div className="pt-2">
                    <button type="submit" className="w-full py-2.5 rounded-lg shadow-sm text-white bg-blue-600 hover:bg-blue-700 font-medium text-base transition-colors">Access Back Office</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Add/Edit Member Modal (Admin Only) */}
          {isModalOpen && isAdmin && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4 fade-in">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden max-h-[95vh] flex flex-col">
                <div className="flex justify-between items-center px-6 py-4 border-b border-gray-100 bg-gray-50 shrink-0">
                  <h2 className="text-lg font-bold text-gray-800">
                    {editingNodeId ? 'Edit Profile' : pendingRelation ? `Add ${pendingRelation.type.charAt(0).toUpperCase() + pendingRelation.type.slice(1)}` : 'Add New Member'}
                  </h2>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-gray-600 bg-gray-200/50 hover:bg-gray-200 rounded-full p-1"><X className="w-5 h-5" /></button>
                </div>
                
                <div className="overflow-y-auto p-6 flex-1">
                  <form id="memberForm" onSubmit={handleSaveMember} className="space-y-5">
                    
                    {/* Basic Info */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div>
                        <label className="block text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">Full Name <span className="text-red-500">*</span></label>
                        <input type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base font-medium" required placeholder="e.g. John Doe" />
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">Nickname</label>
                        <input type="text" value={formData.nickname} onChange={e => setFormData({...formData, nickname: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base" placeholder="e.g. Johnny" />
                      </div>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5 items-end">
                      <div>
                        <label className="block text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">Sex (M/F)</label>
                        <select value={formData.sex} onChange={e => setFormData({...formData, sex: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base">
                          <option value="Unknown">Select...</option><option value="M">Male (M)</option><option value="F">Female (F)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">Date of Birth</label>
                        <input type="date" value={formData.dob} onChange={e => setFormData({...formData, dob: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base" />
                      </div>
                      <div className="flex flex-col gap-1.5">
                        <label className="flex items-center space-x-2 cursor-pointer mb-0.5">
                          <input type="checkbox" checked={formData.isDeceased || false} onChange={e => setFormData({...formData, isDeceased: e.target.checked})} className="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer" />
                          <span className="text-sm font-bold text-gray-500 uppercase tracking-wide">Deceased?</span>
                        </label>
                        <input type="date" disabled={!formData.isDeceased} value={formData.dod} onChange={e => setFormData({...formData, dod: e.target.value})} className={`w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base transition-opacity ${!formData.isDeceased ? 'bg-gray-100 opacity-60 cursor-not-allowed' : 'bg-gray-50'}`} title={!formData.isDeceased ? "Check 'Deceased?' to enter date" : ""} />
                      </div>
                    </div>

                    <div className="border-t border-gray-100 pt-5 grid grid-cols-1 md:grid-cols-2 gap-5">
                      <div>
                        <label className="block text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">Current Address</label>
                        <input type="text" value={formData.address || ''} onChange={e => setFormData({...formData, address: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base" placeholder="Full residential address..." />
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">Contact Number</label>
                        <input type="text" value={formData.contact || ''} onChange={e => setFormData({...formData, contact: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base" placeholder="Phone number, email, etc..." />
                      </div>
                    </div>

                    {/* Relationships */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5 bg-blue-50/50 p-4 rounded-xl border border-blue-100 mt-2">
                      <div>
                        <label className="block text-sm font-bold text-blue-700 uppercase tracking-wide mb-1 flex items-center"><Plus className="w-3 h-3 mr-1"/> Married with</label>
                        <select value={formData.spouseId || ''} onChange={e => setFormData({...formData, spouseId: e.target.value})} className="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base">
                          <option value="">-- None --</option>
                          {nodes.filter(n => n.id !== editingNodeId).map(n => <option key={n.id} value={n.id}>{n.data.name || 'Unnamed'} {n.data.nickname ? `(${n.data.nickname})` : ''}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-sm font-bold text-indigo-700 uppercase tracking-wide mb-1 flex items-center"><Plus className="w-3 h-3 mr-1"/> A Child of</label>
                        <select value={formData.parentId || ''} onChange={e => setFormData({...formData, parentId: e.target.value})} className="w-full px-4 py-2.5 bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base">
                          <option value="">-- None --</option>
                          {nodes.filter(n => n.id !== editingNodeId).map(n => <option key={n.id} value={n.id}>{n.data.name || 'Unnamed'} {n.data.nickname ? `(${n.data.nickname})` : ''}</option>)}
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">Notes</label>
                      <textarea value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} rows={3} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-base resize-none" placeholder="Additional details, biography, etc..." />
                    </div>

                  </form>
                </div>

                <div className="flex justify-end space-x-3 px-6 py-4 border-t border-gray-100 bg-gray-50 shrink-0">
                  <button type="button" onClick={() => setIsModalOpen(false)} className="px-5 py-2.5 rounded-lg text-gray-700 bg-white border border-gray-200 hover:bg-gray-100 font-medium text-sm transition-colors">Cancel</button>
                  <button type="submit" form="memberForm" className="px-5 py-2.5 rounded-lg shadow-sm text-white bg-blue-600 hover:bg-blue-700 font-medium text-sm transition-colors flex items-center">
                    <Cloud className="w-4 h-4 mr-2" /> Save Member
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FamilyTreeApp />);
  </script>
</body>
</html>
